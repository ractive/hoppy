name: Deny

# Separate from ci.yml so it can also run on main without putting the
# build, clippy and fmt jobs there: an advisory published after a PR
# merged still turns main red.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          command: check
          arguments: --workspace --locked
          manifest-path: ./Cargo.toml
          config: deny.toml
