name: Release

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    uses: ractive/release-workflows/.github/workflows/release.yml@v0.1.3
    secrets: inherit
    with:
      dry-run: ${{ github.event_name == 'workflow_dispatch' }}
      bin-name: hoppy
      version-package: hoppy-cli
      publish-crates: bunny-net-api,bunny-syslog-receiver,hoppy-cli
      enable-linux-packages: true
      linux-package-crate: hoppy-cli
      extra-archive-paths: completions man
      # hoppy links OpenSSL (see Cross.toml's libssl pre-build step for the
      # aarch64-unknown-linux-gnu cross target), so it cannot use the shared
      # workflow's default musl targets. No aarch64-*-musl entries here.
      # run_tests is false everywhere: the pre-migration release pipeline
      # never ran tests (PR CI covers them, on ubuntu), and the CLI tests
      # overflow the default 1 MB MSVC stack on Windows.
      targets: >-
        [
          {"target": "x86_64-unknown-linux-gnu",  "os": "ubuntu-latest",  "cross": false, "run_tests": false},
          {"target": "aarch64-unknown-linux-gnu",  "os": "ubuntu-latest",  "cross": true,  "run_tests": false},
          {"target": "aarch64-apple-darwin",       "os": "macos-latest",  "cross": false, "run_tests": false},
          {"target": "x86_64-pc-windows-msvc",     "os": "windows-latest", "cross": false, "run_tests": false},
          {"target": "aarch64-pc-windows-msvc",    "os": "windows-latest", "cross": false, "run_tests": false}
        ]
      # Runs on every matrix target (bash on all OSes, including Windows via
      # git bash) and again in the linux-packages job. Non-runnable targets
      # (CROSS=true, or aarch64-pc-windows-msvc which cross-compiles natively
      # on the Windows x86_64 host) can't execute their own binary, so those
      # cases fall back to a host build via `cargo run`.
      pre-package-command: |
        mkdir -p completions man
        if [ "$CROSS" = "true" ] || [ "$TARGET" = "aarch64-pc-windows-msvc" ]; then
          # --bin disambiguates: hoppy-cli ships hoppy + fixture-refresh.
          cargo run --release --bin hoppy -- completions bash  > completions/hoppy.bash
          cargo run --release --bin hoppy -- completions zsh   > completions/_hoppy
          cargo run --release --bin hoppy -- completions fish  > completions/hoppy.fish
        else
          # BIN_PATH is exported by the shared workflow and points at the
          # binary this job built (target/<triple>/release/ in matrix jobs,
          # target/release/ in linux-packages, .exe resolved on Windows).
          "$BIN_PATH" completions bash > completions/hoppy.bash
          "$BIN_PATH" completions zsh  > completions/_hoppy
          "$BIN_PATH" completions fish > completions/hoppy.fish
        fi
        cargo xtask --output-dir man
        # cargo-deb / cargo-generate-rpm resolve [package.metadata.*] asset
        # paths relative to the crate directory, not the workspace root.
        mkdir -p crates/hoppy-cli/completions crates/hoppy-cli/man
        cp completions/* crates/hoppy-cli/completions/
        cp man/* crates/hoppy-cli/man/
      homebrew-caveats: |
        hoppy container logs requires bore for automatic tunnel setup:
          cargo install bore-cli
          brew install bore-cli
        This is optional — see `hoppy container logs --help` for tunnel alternatives.
