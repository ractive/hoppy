name: Publish crates

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (tag/branch/sha) to publish from"
        required: false
        default: "main"

permissions:
  contents: read

jobs:
  publish:
    uses: ractive/release-workflows/.github/workflows/publish-crates.yml@v0.1.0
    secrets: inherit
    with:
      publish-crates: bunny-net-api,bunny-syslog-receiver,hoppy-cli
      ref: ${{ inputs.ref }}
