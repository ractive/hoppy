# Configuration for cargo-deny — https://embarkstudios.github.io/cargo-deny/
#
# Run locally: cargo deny check
# Runs in CI on every PR and on main (.github/workflows/deny.yml).

[advisories]
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    # webpki-root-certs (transitively pulled in by rustls-platform-verifier)
    # ships the Mozilla CCADB root list under a Community Data License.
    "CDLA-Permissive-2.0",
    # foldhash, a dependency of serde_json (new between 1.0.150 and 1.0.154).
    "Zlib",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
