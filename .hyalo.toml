dir = "hoppy-knowledgebase"
site_prefix = ""
validate_on_write = true

[lint]
profiles = ["madr"]

[schema]
exempt = ["**/index.md", "**/log.md", "docs/decisions/README.md", "docs/decisions/index.md"]

[[schema.bind]]
glob = "docs/decisions/**/*.md"
type = "adr"

[schema.default]
required = ["type"]

[schema.default.properties.description]
type = "string"

[schema.default.properties.resource]
pattern = '^\w[\w+.-]*://'
type = "string"

[schema.default.properties.tags]
type = "list"

[schema.default.properties.timestamp]
type = "datetime-tz"

[schema.default.properties.title]
type = "string"

[schema.types."BigQuery Dataset"]
required = ["type", "title"]

[schema.types."BigQuery Table"]
required = ["type", "title"]
required_sections = ["# Schema", "# Citations"]

[schema.types.Reference]
required = ["type", "title"]

[schema.types.adr]
filename-template = "docs/decisions/{n:04}-{slug}.md"
required = []
required_sections = ["## Context and Problem Statement", "## Considered Options", "## Decision Outcome"]

[schema.types.adr.defaults]
date = "$today"
status = "proposed"

[schema.types.adr.properties.consulted]
type = "string-list"

[schema.types.adr.properties.date]
type = "date"

[schema.types.adr.properties.deciders]
type = "string-list"

[schema.types.adr.properties.decision-makers]
type = "string-list"

[schema.types.adr.properties.informed]
type = "string-list"

[schema.types.adr.properties.status]
pattern = "^(proposed|rejected|accepted|deprecated|superseded by ADR-[0-9]{4})$"
type = "string"

[schema.types.adr.properties.title]
type = "string"

[schema.types.backlog]
required = ["title", "type", "date", "status"]

[schema.types.backlog.properties.blocked-by]
type = "string"

[schema.types.backlog.properties.date]
type = "date"

[schema.types.backlog.properties.origin]
type = "string"

[schema.types.backlog.properties.priority]
type = "enum"
values = ["low", "medium", "high", "critical"]

[schema.types.backlog.properties.resolved-by]
type = "string"

[schema.types.backlog.properties.resolved-in]
type = "string"

[schema.types.backlog.properties.status]
type = "enum"
values = ["planned", "in-progress", "completed", "superseded", "wont-do", "deferred", "shelved", "not-a-bug", "open", "resolved"]

[schema.types.decision]
required = ["title", "type", "date", "status"]

[schema.types.decision.properties.date]
type = "date"

[schema.types.decision.properties.status]
type = "enum"
values = ["active", "archived", "reference"]

[schema.types.docs]
required = ["title", "type", "date", "status"]

[schema.types.docs.properties.date]
type = "date"

[schema.types.docs.properties.status]
type = "enum"
values = ["active", "archived", "draft"]

[schema.types.iteration]
filename-template = "iterations/iteration-{n}-{slug}.md"
required = ["title", "type", "date", "status", "branch", "tags"]

[schema.types.iteration.defaults]
date = "$today"
status = "planned"
type = "iteration"

[schema.types.iteration.properties.branch]
pattern = '^iter-\d+(\.\d+)?[a-z]*/'
type = "string"

[schema.types.iteration.properties.date]
type = "date"

[schema.types.iteration.properties.depends-on]
type = "string"

[schema.types.iteration.properties.priority]
type = "number"

[schema.types.iteration.properties.related]
type = "list"

[schema.types.iteration.properties.status]
type = "enum"
values = ["planned", "in-progress", "completed", "superseded", "shelved", "deferred"]

[schema.types.iteration.properties.superseded-by]
type = "string"

[schema.types.iteration.properties.supersedes]
type = "string"

[schema.types.iteration.properties.tags]
type = "list"

[schema.types.research]
required = ["title", "type", "date", "status"]

[schema.types.research.properties.date]
type = "date"

[schema.types.research.properties.origin]
type = "string"

[schema.types.research.properties.recommendation]
type = "string"

[schema.types.research.properties.related]
type = "list"

[schema.types.research.properties.source]
type = "string"

[schema.types.research.properties.status]
type = "enum"
values = ["active", "archived", "reference", "completed", "superseded"]

[schema.types.research.properties.supersedes]
type = "string"

[views.completed-with-todos]
fields = ["tasks"]
properties = ["status=completed"]
task = "todo"

[views.missing-status]
properties = ["!status"]

[views.missing-type]
properties = ["!type"]

[views.open-tasks]
task = "todo"

[views.orphans]
fields = ["backlinks"]
orphan = true

[views.planned]
properties = ["status=planned"]

[views.stale-in-progress]
fields = ["tasks"]
properties = ["status=in-progress"]
