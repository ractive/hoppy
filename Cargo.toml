[workspace]
members = [
    ".",
    "crates/bunny-api-compute",
    "crates/bunny-api-containers",
    "crates/bunny-api-core",
    "crates/bunny-api-database",
    "crates/bunny-api-shield",
    "crates/bunny-api-storage",
    "crates/bunny-api-stream",
    "crates/bunny-api-recording",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ractive/hoppy"

[workspace.dependencies]
# Internal crates
bunny-api-compute = { path = "crates/bunny-api-compute", version = "0.1.0" }
bunny-api-containers = { path = "crates/bunny-api-containers", version = "0.1.0" }
bunny-api-core = { path = "crates/bunny-api-core", version = "0.1.0" }
bunny-api-database = { path = "crates/bunny-api-database", version = "0.1.0" }
bunny-api-recording = { path = "crates/bunny-api-recording", version = "0.1.0" }
bunny-api-shield = { path = "crates/bunny-api-shield", version = "0.1.0" }
bunny-api-storage = { path = "crates/bunny-api-storage", version = "0.1.0" }
bunny-api-stream = { path = "crates/bunny-api-stream", version = "0.1.0" }
hoppy = { path = ".", version = "0.1.0" }

# External dependencies
anyhow = "1"
assert_cmd = "2"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
clap_mangen = "0.2"
console = "0.16.3"
indicatif = { version = "0.18.4", features = ["tokio"] }
insta = { version = "1", features = ["json", "redactions"] }
percent-encoding = "2"
predicates = "3"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
tabled = "0.17"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-util = { version = "0.7.18", features = ["io"] }
urlencoding = "2"
wiremock = "0.6"

[workspace.lints.rust]
unsafe_code = "forbid"

# Pedantic lints deferred — see iter-23 plan; future iteration to enable incrementally.

[package]
name = "hoppy"
version.workspace = true
edition.workspace = true
description = "CLI for bunny.net services"
license.workspace = true
repository.workspace = true
homepage = "https://github.com/ractive/hoppy"
readme = "README.md"
keywords = ["bunny", "cdn", "cli", "dns", "edge"]
categories = ["command-line-utilities"]

[dependencies]
clap = { workspace = true }
clap_complete.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
anyhow.workspace = true
tabled.workspace = true
tokio = { workspace = true, features = ["fs"] }
indicatif.workspace = true
tokio-util.workspace = true
console.workspace = true
reqwest = { workspace = true, features = ["stream"] }
bunny-api-compute.workspace = true
bunny-api-containers.workspace = true
bunny-api-core.workspace = true
bunny-api-database.workspace = true
bunny-api-shield.workspace = true
bunny-api-storage.workspace = true
bunny-api-stream.workspace = true

[features]
live-api = []

[[test]]
name = "e2e"
path = "tests/e2e/mod.rs"

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
insta.workspace = true
wiremock.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
tempfile.workspace = true

[package.metadata.deb]
maintainer = "ractive"
section = "utils"
priority = "optional"
assets = [
    ["target/release/hoppy", "usr/bin/", "755"],
    ["completions/hoppy.bash", "usr/share/bash-completion/completions/hoppy", "644"],
    ["completions/_hoppy", "usr/share/zsh/vendor-completions/_hoppy", "644"],
    ["completions/hoppy.fish", "usr/share/fish/vendor_completions.d/hoppy.fish", "644"],
    ["man/*.1", "usr/share/man/man1/", "644"],
    ["LICENSE", "usr/share/doc/hoppy/", "644"],
    ["README.md", "usr/share/doc/hoppy/", "644"],
]
extended-description = "A CLI tool for managing bunny.net cloud and edge services including CDN pull zones, storage, DNS, video streaming, security (WAF/DDoS), edge scripting, and magic containers."

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/hoppy", dest = "/usr/bin/hoppy", mode = "755" },
    { source = "completions/hoppy.bash", dest = "/usr/share/bash-completion/completions/hoppy", mode = "644" },
    { source = "completions/_hoppy", dest = "/usr/share/zsh/site-functions/_hoppy", mode = "644" },
    { source = "completions/hoppy.fish", dest = "/usr/share/fish/vendor_completions.d/hoppy.fish", mode = "644" },
    { source = "man/*.1", dest = "/usr/share/man/man1/", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/doc/hoppy/LICENSE", mode = "644", doc = true },
    { source = "README.md", dest = "/usr/share/doc/hoppy/README.md", mode = "644", doc = true },
]

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
