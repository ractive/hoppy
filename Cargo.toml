[workspace]
members = ["crates/*", "xtask"]
default-members = ["crates/hoppy-cli"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ractive/hoppy"
homepage = "https://github.com/ractive/hoppy"

[workspace.dependencies]
# Internal crates — path + version for crates.io publish compatibility.
# version must match [workspace.package].version exactly.
bunny-net-api = { path = "crates/bunny-net-api", version = "0.3.0" }
bunny-syslog-receiver = { path = "crates/bunny-syslog-receiver", version = "0.3.0" }
hoppy-cli = { path = "crates/hoppy-cli", version = "0.3.0" }

# External dependencies
anyhow = "1"
assert_cmd = "2"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
clap_mangen = "0.3"
console = "0.16.3"
indicatif = { version = "0.18.4", features = ["tokio"] }
insta = { version = "1", features = ["filters", "json", "redactions"] }
percent-encoding = "2"
predicates = "3"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
tabled = "0.20"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-util = { version = "0.7.18", features = ["io"] }
urlencoding = "2"
walkdir = "2"
wiremock = "0.6"
# `syn` and `walkdir` are only used by the `fixture-refresh` dev binary in
# `crates/hoppy-cli/src/bin/fixture_refresh.rs`. They are listed here as
# workspace deps for consistency but no other workspace crate should
# `.workspace = true` them without good reason — `syn = "full"` is a heavy
# compile-time dependency.
syn = { version = "2", features = ["full", "extra-traits", "visit"] }

[workspace.lints.rust]
unsafe_code = "forbid"

# Pedantic lints deferred — see iter-23 plan; future iteration to enable incrementally.

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
