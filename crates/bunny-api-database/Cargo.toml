[package]
name = "bunny-api-database"
version = "0.1.0"
edition = "2024"
description = "Hand-written bunny.net Database (libSQL) API client"
license = "MIT"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
bytes = "1"
bunny-api-recording = { path = "../bunny-api-recording" }
urlencoding = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"

[[test]]
name = "e2e"
path = "tests/e2e/mod.rs"
