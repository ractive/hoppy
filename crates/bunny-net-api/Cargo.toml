[package]
name = "bunny-net-api"
description = "Rust client for bunny.net APIs (CDN, storage, DNS, stream, edge, containers)"
keywords = ["bunny", "cdn", "api", "client"]
categories = ["api-bindings"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["core", "compute", "containers", "database", "logging", "origin-errors", "recording", "shield", "storage", "stream"]
recording = []
core = ["recording"]
compute = ["core"]
containers = ["core"]
database = ["core"]
logging = ["core"]
origin-errors = ["core"]
shield = ["core"]
storage = ["core"]
stream = ["core"]

[dependencies]
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_repr.workspace = true
anyhow.workspace = true
base64.workspace = true
bytes.workspace = true
percent-encoding.workspace = true
urlencoding.workspace = true

[dev-dependencies]
tokio.workspace = true
wiremock.workspace = true
tempfile.workspace = true

[[test]]
name = "e2e-compute"
path = "tests/compute/e2e/mod.rs"

[[test]]
name = "e2e-containers"
path = "tests/containers/e2e/mod.rs"

[[test]]
name = "e2e-core"
path = "tests/core/e2e/mod.rs"

[[test]]
name = "e2e-database"
path = "tests/database/e2e/mod.rs"

[[test]]
name = "e2e-logging"
path = "tests/logging/e2e/mod.rs"

[[test]]
name = "e2e-origin-errors"
path = "tests/origin_errors/e2e/mod.rs"

[[test]]
name = "e2e-shield"
path = "tests/shield/e2e/mod.rs"

[[test]]
name = "e2e-storage"
path = "tests/storage/e2e/mod.rs"

[[test]]
name = "e2e-stream"
path = "tests/stream/e2e/mod.rs"
