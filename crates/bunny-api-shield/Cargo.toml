[package]
name = "bunny-api-shield"
version = "0.1.0"
edition = "2024"
description = "Hand-written bunny.net Shield API client (WAF, DDoS, Rate Limiting, Bot Detection, Access Lists)"
license = "MIT"

[dependencies]
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
anyhow = "1"
bytes = "1"
percent-encoding = "2"
bunny-api-recording = { path = "../bunny-api-recording" }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"

[[test]]
name = "e2e"
path = "tests/e2e/mod.rs"
